# ==============================================================================
# AgentGuard AI — Local Development Infrastructure (Milestone 1.2)
# ==============================================================================
# Starts local PostgreSQL 16 and Redis containers for local testing and development.
# Usage:
#   docker compose -f infrastructure/docker-compose.yml up -d
#   docker compose -f infrastructure/docker-compose.yml down
#
# SECURITY NOTICE:
# - Ports are strictly bound to loopback (127.0.0.1) to prevent LAN/external exposure.
# - The credentials specified below are strictly for isolated LOCAL DEVELOPMENT.
# - DO NOT use these default passwords in staging, QA, or production environments!

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentguard_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-agentguard_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentguard} -d ${POSTGRES_DB:-agentguard_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: agentguard-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
